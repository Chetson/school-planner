server {
    listen       8080;
    server_name  localhost;

    root   /usr/share/nginx/html;

    location / {
        try_files $uri $uri/index.html $uri.html /index.html index.htm;
    }

    error_page  404 =200 /index.html;

    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }

}
